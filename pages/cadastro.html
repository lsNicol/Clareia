<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Cadastro | ClareIA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;800&display=swap"
    rel="stylesheet">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <header class="header-app">
        <a class="clareia-logo" href="../index.html" aria-label="ClareIA, página inicial">
            <img src="../img/logo-simbolo.svg" alt="Clareia">
        </a>
        <div class="login-link">
            <span>Já possui uma conta?</span>
            <a href="../index.html?conta=entrar">Entrar</a>
        </div>
    </header>
    <main class="cadastro">
        <h1>Crie sua conta</h1>
        <p class="subtitle">
            Entenda sua conta de energia e acompanhe seu consumo com a ClareIA.
        </p>
        <form id="cadastroForm" novalidate>
            <div class="dupla">
                <div class="campo">
                    <label for="nome">Nome</label>
                    <input id="nome" name="nome" type="text" autocomplete="given-name" required aria-describedby="nome-erro">
                    <p id="nome-erro" class="erro-campo" aria-live="polite"></p>
                </div>

                <div class="campo">
                    <label for="sobrenome">Sobrenome</label>
                    <input id="sobrenome" name="sobrenome" type="text" autocomplete="family-name" required aria-describedby="sobrenome-erro">
                    <p id="sobrenome-erro" class="erro-campo" aria-live="polite"></p>
                </div>
            </div>
            <div class="dupla">
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input id="cpf" name="cpf" type="text" inputmode="numeric" maxlength="14" required aria-describedby="cpf-erro">
                    <p id="cpf-erro" class="erro-campo" aria-live="polite"></p>
                </div>
                <div class="campo">
                    <label for="nascimento">Data de nascimento</label>
                    <input id="nascimento" name="nascimento" type="text" inputmode="numeric" autocomplete="bday" placeholder="DD/MM/AAAA" maxlength="10" required aria-describedby="nascimento-erro">
                    <p id="nascimento-erro" class="erro-campo" aria-live="polite"></p>
                </div>
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-erro">
                <p id="email-erro" class="erro-campo" aria-live="polite"></p>
            </div>
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input id="telefone" name="telefone" type="tel" autocomplete="tel-national" maxlength="15" required aria-describedby="telefone-erro">
                <p id="telefone-erro" class="erro-campo" aria-live="polite"></p>
            </div>
            <div class="dupla">
                <div class="campo">
                    <label for="cep">CEP</label>
                    <input id="cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="9" required aria-describedby="cep-erro">
                    <p id="cep-erro" class="erro-campo" aria-live="polite"></p>
                </div>
                <div class="campo">
                    <label for="numero">Número</label>
                    <input id="numero" name="numero" type="text" inputmode="numeric" required aria-describedby="numero-erro">
                    <p id="numero-erro" class="erro-campo" aria-live="polite"></p>
                </div>
            </div>
            <div class="campo">
                <label for="complemento">Complemento (Opcional)</label>
                <input id="complemento" name="complemento" type="text" autocomplete="address-line2">
            </div>
            <div class="campo">
                <label for="password">Senha</label>
                <div class="password-container">
                    <input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-erro">
                    <button type="button" class="eye-icon" aria-label="Mostrar senha">
                        <img src="../img/eye.svg" alt="">
                    </button>
                </div>
                <p id="password-erro" class="erro-campo" aria-live="polite"></p>
            </div>
            <div class="campo">
                <label for="confirm-password">Confirmar senha</label>
                <div class="password-container">
                    <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required aria-describedby="confirm-password-erro">
                    <button type="button" class="eye-icon" aria-label="Mostrar senha">
                        <img src="../img/eye.svg" alt="">
                    </button>
                </div>
                <p id="confirm-password-erro" class="erro-campo" aria-live="polite"></p>
            </div>
            <label class="checkbox" for="termos">
                <input type="checkbox" id="termos" name="termos" required aria-describedby="termos-erro">
                Concordo com os Termos de Uso e Política de Privacidade
            </label>
            <p id="termos-erro" class="erro-campo" aria-live="polite"></p>
            <button type="submit" class="criar-conta">
                Criar conta
            </button>
            <div class="separator">
                <span>ou</span>
            </div>
            <button type="button" class="google" data-google>
                <img src="../img/google-icon.svg" alt="">
                Continuar com Google
            </button>
            <p id="cadastro-status" role="status"></p>
        </form>
    </main>
    <script src="../js/cadastro.js" defer></script>
</body>
</html>
